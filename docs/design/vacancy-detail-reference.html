<title>Job Search Copilot — Vacancy detail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;

    --color-bg: #F5F7FB;
    --color-surface: #FFFFFF;
    --color-surface-alt: #EEF2FA;
    --color-surface-sunken: #E7EDF7;
    --color-border: #DAE3F0;
    --color-border-strong: #BECDE3;
    --color-ink: #12151E;
    --color-ink-soft: #3A4252;
    --color-ink-muted: #69738A;
    --color-ink-faint: #99A2B4;
    --color-accent: #2E5CD6;
    --color-accent-ink: #1F45B0;
    --color-accent-soft: #E6EDFC;
    --color-accent-soft-border: #C2D3F5;
    --color-good: #17A874;
    --color-good-soft: #E2F6EC;
    --color-good-soft-border: #BAE9D1;
    --color-warn: #B4780A;
    --color-warn-soft: #FBF0DA;
    --color-warn-soft-border: #EFD79C;
    --color-bad: #DC3D3D;
    --color-bad-soft: #FBEAEA;
    --color-bad-soft-border: #F2C3C3;

    --shadow-card: 0 1px 2px rgba(18, 21, 30, 0.06);
    --shadow-pop: 0 8px 22px rgba(18, 21, 30, 0.09);
  }

  @layer base {
    body { @apply bg-bg text-ink antialiased font-sans; }
    h1, h2, h3 { text-wrap: balance; margin: 0; }
    a { @apply text-accent; }
    button { font-family: inherit; }
  }

  @layer components {
    .mono { @apply font-mono tabular-nums; }

    /* shell — identical to the main dashboard file, so both can share one stylesheet later */
    .app { @apply flex; min-height: 100vh; }

    .sidebar {
      --rail-w: 72px;
      @apply fixed inset-y-0 left-0 z-40 flex w-[244px] flex-none flex-col gap-[18px] overflow-y-auto overflow-x-hidden border-r border-border bg-surface px-[14px] py-[18px];
      transition: width .18s ease, transform .22s ease;
    }
    .sidebar.collapsed { width: var(--rail-w); @apply px-[10px]; }
    .sidebar.collapsed .brand { @apply justify-center px-0 py-[4px]; }
    .sidebar.collapsed .brand-text,
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-text,
    .sidebar.collapsed .nav-count,
    .sidebar.collapsed .soon-pill,
    .sidebar.collapsed .foot-text,
    .sidebar.collapsed .rail-toggle .rail-toggle-text { @apply hidden; }
    .sidebar.collapsed .nav-item { @apply justify-center px-0 py-[10px]; }
    .sidebar.collapsed .nav-item svg { opacity: 1; }
    .sidebar.collapsed .sidebar-foot { @apply justify-center px-0; }
    .sidebar.collapsed .rail-toggle { @apply justify-center; }
    .sidebar.collapsed .rail-toggle svg { transform: rotate(180deg); }

    .brand { @apply flex items-center gap-[10px] px-[8px] py-[4px]; }
    .brand-mark {
      @apply flex h-[30px] w-[30px] flex-none items-center justify-center rounded-[8px] text-white;
      background: linear-gradient(155deg, var(--color-accent), var(--color-accent-ink));
    }
    .brand-mark svg { @apply h-[17px] w-[17px]; }
    .brand-name { @apply text-[15px] font-extrabold leading-[1.15] tracking-[-0.01em]; }
    .brand-sub { @apply text-[11px] text-ink-muted; }

    .nav { @apply flex flex-col gap-[2px]; }
    .nav-label { @apply px-[10px] pb-[4px] pt-[10px] text-[10.5px] font-bold uppercase tracking-[.07em] text-ink-faint; }
    .nav-item {
      @apply flex w-full cursor-pointer items-center gap-[10px] rounded-[9px] border border-transparent bg-transparent px-[10px] py-[9px] text-left text-[13.5px] font-semibold text-ink-soft no-underline;
    }
    .nav-item svg { @apply h-[16px] w-[16px] flex-none opacity-80; }
    .nav-item:hover { @apply bg-surface-alt text-ink; }
    .nav-item.active { @apply border-accent-soft-border bg-accent-soft text-accent-ink; }
    .nav-item.active svg { opacity: 1; }
    .nav-count { @apply ml-auto rounded-[6px] bg-surface-sunken px-[6px] py-[1px] font-mono text-[11px] text-ink-faint; }
    .nav-item.active .nav-count { @apply text-accent-ink; background: #fff2; }
    .nav-item.disabled { @apply cursor-default opacity-55; }
    .nav-item.disabled:hover { @apply bg-transparent text-ink-soft; }
    .soon-pill { @apply ml-auto rounded-[20px] border border-border bg-surface-sunken px-[6px] py-[1px] text-[9.5px] font-bold tracking-[.04em] text-ink-muted; }

    .sidebar-foot { @apply mt-auto flex items-center gap-[9px] border-t border-border px-[8px] pb-[4px] pt-[10px]; }
    .avatar { @apply flex h-[28px] w-[28px] flex-none items-center justify-center rounded-full border border-border bg-surface-sunken text-[11px] font-bold text-ink-muted; }
    .foot-name { @apply text-[12.5px] font-bold leading-[1.2]; }
    .foot-role { @apply text-[10.5px] text-ink-muted; }

    .scrim { @apply hidden; }

    .main { @apply flex min-w-0 flex-1 flex-col; margin-left: 244px; transition: margin-left .18s ease; }
    .main.rail { margin-left: 72px; }

    .rail-toggle { @apply my-[2px] flex w-full cursor-pointer items-center gap-[10px] rounded-[9px] border border-border bg-surface-alt px-[10px] py-[8px] text-[12px] font-bold text-ink-muted; }
    .rail-toggle:hover { @apply border-border-strong text-ink; }
    .rail-toggle svg { @apply h-[15px] w-[15px] flex-none; transition: transform .18s ease; }

    .topbar {
      @apply sticky top-0 z-20 flex items-end justify-between gap-[16px] border-b border-border px-[28px] py-[16px] backdrop-blur-[8px];
      background: color-mix(in srgb, var(--color-bg) 88%, transparent);
    }
    .topbar-title { @apply text-[20px] font-extrabold tracking-[-0.01em]; }
    .topbar-sub { @apply mt-[3px] text-[12.5px] text-ink-muted; }
    .menu-toggle { @apply hidden h-[34px] w-[34px] flex-none cursor-pointer items-center justify-center rounded-[8px] border border-border bg-surface text-ink-soft; }
    .topbar-meta { @apply whitespace-nowrap text-right text-[11.5px] text-ink-faint; }

    .view { @apply px-[28px] pb-[56px] pt-[24px]; }
    .view[hidden] { display: none; }

    /* shared bits */
    .card { @apply rounded-[14px] border border-border bg-surface shadow-card; }
    .card-head { @apply flex flex-wrap items-center justify-between gap-[12px] px-[18px] pb-[12px] pt-[16px]; }
    .card-head h2 { @apply text-[15px] font-extrabold; }
    .card-head .count { @apply mt-[2px] text-[12px] text-ink-muted; }

    .table-scroll { @apply overflow-x-auto; }
    table { @apply w-full border-collapse; min-width: 560px; }
    thead th { @apply sticky top-0 border-b border-border bg-surface px-[18px] py-[9px] text-left text-[10.5px] font-bold uppercase tracking-[.05em] text-ink-faint; }
    tbody td { @apply border-b border-border px-[18px] py-[13px] align-top text-[13px]; }
    tbody tr:last-child td { @apply border-b-0; }
    tbody tr:hover { @apply bg-surface-alt; }

    .role-title { @apply text-[13.5px] font-bold text-ink; }
    .role-title.sibling-link { @apply cursor-pointer border-none bg-transparent p-0 text-left no-underline; }
    .role-title.sibling-link:hover { @apply text-accent-ink underline; }
    .role-title-row { @apply flex items-center gap-[6px]; }
    .row-link-btn { @apply inline-flex h-[21px] w-[21px] flex-none items-center justify-center rounded-[6px] border border-border text-ink-faint no-underline; }
    .row-link-btn:hover { @apply border-accent-soft-border bg-accent-soft text-accent-ink; }
    .row-link-btn svg { @apply h-[11px] w-[11px]; }
    .role-meta { @apply mt-[2px] text-[12px] text-ink-muted; }
    .date-cell { @apply whitespace-nowrap text-[12.5px] text-ink-soft; }

    .pill { @apply inline-flex items-center gap-[4px] whitespace-nowrap rounded-[20px] border border-transparent px-[9px] py-[2px] font-mono text-[12px] font-semibold; }
    .pill.score-hi { @apply border-good-soft-border bg-good-soft text-good; }
    .pill.score-mid { @apply border-warn-soft-border bg-warn-soft text-warn; }
    .pill.score-lo { @apply border-border bg-surface-sunken text-ink-muted; }
    .tag { @apply whitespace-nowrap rounded-[20px] border border-transparent px-[9px] py-[3px] font-sans text-[11px] font-bold; }
    .tag.good { @apply border-good-soft-border bg-good-soft text-good; }
    .tag.warn { @apply border-warn-soft-border bg-warn-soft text-warn; }
    .tag.bad { @apply border-bad-soft-border bg-bad-soft text-bad; }
    .tag.neutral { @apply border-border bg-surface-sunken text-ink-muted; }
    .tag.accent { @apply border-accent-soft-border bg-accent-soft text-accent-ink; }

    .icon-btn { @apply relative inline-flex h-[30px] w-[30px] cursor-pointer items-center justify-center rounded-[8px] border border-border-strong bg-surface text-ink-muted; }
    .icon-btn:hover { @apply border-accent-soft-border bg-accent-soft text-accent-ink; }
    .icon-btn svg { @apply h-[14px] w-[14px]; }
    .copied-flag {
      @apply pointer-events-none absolute bottom-[calc(100%+6px)] left-1/2 -translate-x-1/2 whitespace-nowrap rounded-[6px] bg-ink px-[7px] py-[3px] text-[10.5px] font-bold text-bg opacity-0;
      transition: opacity .15s ease;
    }
    .icon-btn.flash .copied-flag { @apply opacity-100; }

    select.status-select { @apply rounded-[9px] border border-border-strong bg-surface px-[10px] py-[7px] text-[12.5px] font-semibold text-ink; }

    .empty-state { @apply px-[18px] py-[46px] text-center text-[13px] text-ink-muted; }

    /* vacancy detail */
    .back-link { @apply mb-[14px] inline-flex items-center gap-[6px] text-[12.5px] font-semibold text-ink-muted no-underline; }
    .back-link:hover { @apply text-accent-ink; }
    .back-link svg { @apply h-[14px] w-[14px]; }

    .detail-header { @apply mb-[20px] flex flex-wrap items-start justify-between gap-[16px]; }
    .detail-company-row { @apply mb-[6px] flex items-center gap-[8px]; }
    .company-mark { @apply flex h-[22px] w-[22px] flex-none items-center justify-center rounded-[6px] bg-surface-sunken text-[10px] font-bold text-ink-muted; }
    .detail-company-name { @apply text-[13px] font-semibold text-ink-muted; }
    .detail-title { @apply text-[22px] font-extrabold leading-[1.2] tracking-[-0.01em]; }
    .detail-id-tag { @apply font-mono font-semibold; }
    .detail-meta-row { @apply mt-[10px] flex flex-wrap items-center gap-[8px] text-[12.5px] text-ink-muted; }
    .detail-meta-sep { @apply text-ink-faint; }
    .detail-header-actions { @apply flex flex-none items-center gap-[8px]; }
    .rec-link { @apply no-underline; }
    .rec-link:hover .tag { @apply border-good-soft-border; filter: brightness(1.05); }

    .status-timeline { @apply flex items-center overflow-x-auto px-[18px] py-[16px]; }
    .timeline-node { @apply flex flex-none flex-col items-center gap-[6px] text-center; width: 108px; }
    .timeline-dot {
      @apply flex h-[26px] w-[26px] flex-none items-center justify-center rounded-full border-2 text-[11px] font-bold;
      background: var(--color-surface);
    }
    .timeline-node.node-done .timeline-dot { @apply border-border-strong bg-surface-sunken text-ink-muted; }
    .timeline-node.node-current .timeline-dot { @apply border-accent bg-accent-soft text-accent-ink; box-shadow: 0 0 0 3px var(--color-accent-soft); }
    .timeline-node.node-bad .timeline-dot { @apply border-bad bg-bad-soft text-bad; }
    .timeline-node.node-good .timeline-dot { @apply border-good bg-good-soft text-good; }
    .timeline-node.node-bad .timeline-dot svg, .timeline-node.node-good .timeline-dot svg { @apply h-[12px] w-[12px]; }
    .timeline-label { @apply text-[11.5px] font-bold text-ink; }
    .timeline-node.node-done .timeline-label { @apply font-semibold text-ink-muted; }
    .timeline-date { @apply text-[10.5px] text-ink-faint; }
    /* Fixed (not flex-1) so a short 2-node timeline stays compact near the left edge instead of
       stretching the connector to fill the whole card; with more nodes every segment is still the
       same width, so the extra statuses lay out evenly along the line. */
    .timeline-connector { @apply h-[2px] bg-border-strong; width: 64px; margin: 0 -2px 20px; }
    .timeline-connector.connector-bad { background: repeating-linear-gradient(90deg, var(--color-bad), var(--color-bad) 4px, transparent 4px, transparent 8px); }
    .timeline-connector.connector-good { @apply bg-good; }
    .timeline-connector.connector-trailing { background: repeating-linear-gradient(90deg, var(--color-border-strong), var(--color-border-strong) 4px, transparent 4px, transparent 8px); max-width: 40px; }

    .dash-grid { @apply grid items-start gap-[16px]; grid-template-columns: 1.5fr 1fr; }
    .stack-gap { @apply flex flex-col gap-[16px]; }

    .desc-wrap { @apply relative; }
    .desc-body {
      @apply whitespace-pre-line px-[18px] pb-[18px] pt-[2px] text-[13.5px] leading-[1.65] text-ink-soft;
      max-height: 220px; overflow: hidden;
    }
    .desc-wrap.expanded .desc-body { max-height: none; }
    .desc-fade {
      @apply pointer-events-none absolute inset-x-0 bottom-0 h-[64px];
      background: linear-gradient(to bottom, transparent, var(--color-surface));
    }
    .desc-wrap.expanded .desc-fade { @apply hidden; }
    .desc-toggle {
      @apply mx-[18px] mb-[16px] mt-[10px] inline-flex cursor-pointer items-center gap-[5px] rounded-[8px] border border-border-strong bg-surface px-[10px] py-[6px] text-[12px] font-bold text-accent-ink;
    }
    .desc-toggle:hover { @apply border-accent-soft-border bg-accent-soft; }
    .desc-toggle svg { @apply h-[13px] w-[13px]; transition: transform .15s ease; }
    .desc-toggle.expanded svg { transform: rotate(180deg); }

    .empty-block { @apply mx-auto flex max-w-[320px] flex-col items-center gap-[10px] px-[20px] py-[38px] text-center; }
    .empty-block .empty-icon { @apply flex h-[40px] w-[40px] items-center justify-center rounded-[12px] border border-accent-soft-border bg-accent-soft text-accent-ink; }
    .empty-block .empty-icon svg { @apply h-[19px] w-[19px]; }
    .empty-block p { @apply text-[12.5px] font-bold text-ink; }
    .empty-block span { @apply text-[12px] text-ink-muted; }

    .history-list { @apply flex flex-col; }
    .history-item { @apply flex items-start gap-[11px] border-b border-border px-[18px] py-[13px]; }
    .history-item:last-child { @apply border-b-0; }
    .history-badge { @apply flex h-[26px] w-[26px] flex-none items-center justify-center rounded-full; }
    .history-badge svg { @apply h-[13px] w-[13px]; }
    .history-badge.src-analyzer { @apply bg-accent-soft text-accent-ink; }
    .history-badge.src-user { @apply bg-surface-sunken text-ink-muted; }
    .history-badge.src-agent { @apply bg-warn-soft text-warn; }
    .history-body { @apply min-w-0 flex-1; }
    .history-head { @apply flex flex-wrap items-baseline justify-between gap-[8px]; }
    .history-source { @apply text-[12.5px] font-bold text-ink; }
    .history-time { @apply flex-none font-mono text-[11px] text-ink-faint; }
    .history-text { @apply mt-[3px] whitespace-pre-line text-[12.5px] leading-[1.55] text-ink-soft; }

    .fact-list { @apply flex flex-col; }
    .fact-row { @apply flex items-center justify-between gap-[10px] border-b border-border px-[18px] py-[10px] text-[12.5px]; }
    .fact-row:last-child { @apply border-b-0; }
    .fact-label { @apply text-ink-muted; }
    .fact-value { @apply text-right font-semibold text-ink; }
    .fact-value.mono { @apply font-mono; }

    /* responsive */
    @media (max-width: 860px) {
      .sidebar, .sidebar.collapsed { @apply w-[244px] px-[14px]; transform: translateX(-100%); box-shadow: var(--shadow-pop); }
      .sidebar.open { transform: translateX(0); }
      .sidebar.collapsed .brand-text, .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-text,
      .sidebar.collapsed .nav-count, .sidebar.collapsed .soon-pill, .sidebar.collapsed .foot-text,
      .sidebar.collapsed .rail-toggle-text { display: revert; }
      .sidebar.collapsed .brand { @apply justify-start; }
      .sidebar.collapsed .nav-item { @apply justify-start px-[10px] py-[9px]; }
      .sidebar.collapsed .sidebar-foot { @apply justify-start; }
      .rail-toggle { @apply hidden; }
      .main, .main.rail { margin-left: 0; }
      .menu-toggle { @apply inline-flex; }
      .scrim.show { @apply fixed inset-0 z-30 block; background: rgba(10,12,16,.4); }
      .topbar { @apply px-[16px] py-[14px]; }
      .view { @apply px-[14px] pb-[44px] pt-[18px]; }
      .detail-header-actions { @apply w-full; }
    }
    @media (max-width: 980px) {
      .dash-grid { grid-template-columns: 1fr; }
    }
  }
</style>

<!--
  Reference page for the vacancy-detail route (e.g. /vacancies/:id). Same
  design system as dashboard-reference.html — same tokens, same component
  classes — so both files can eventually share one stylesheet. This page
  is reached by drilling into a row from Analyzed vacancies or Vacancy log;
  the sidebar/topbar shell is reproduced here for context but the nav
  buttons are inert (no other views exist in this standalone file) — wire
  them to real routes and mark the correct one active based on where the
  visit came from.

  Data below is shaped exactly like the job-search-copilot MCP server's
  get_vacancy / list_vacancies output (see comments near the data block):
  id, company, title, applyUrl, fullText, matchScore, recommendation,
  status, createdAt, statusChangedAt, updatedAt, salaryInListing,
  usedTailoredResume, comments[{id, createdAt, body, source}]. The base
  record and its first comment are real (anonymised none, used as-is);
  the "USER" and status-tracker comments are added to illustrate the
  different comment sources you asked for (yours, the analyzer's, and an
  automated status-tracking agent's) — the live API currently only
  returns ANALYZER comments, so treat "USER"/"STATUS_TRACKER" as the
  expected shape once manual notes and the email-status-tracker start
  writing comments too, not as confirmed source values.

  NOTE ON VOCABULARY: dashboard-reference.html's mock tables use a
  simplified status/recommendation vocabulary ("Not reviewed", "Apply",
  "Consider", "Pass"...) that predates checking the real MCP schema. The
  actual backend enums are NOT_REVIEWED/SAVED_FOR_LATER/DECLINED/APPLIED/
  RECRUITER_SCREEN/REPLIED/INTERVIEW/OFFER/REJECTED for status, and
  APPLY/APPLY_WITH_CAVEATS/SKIP for recommendation. This page uses the
  real enum values directly (see STATUS_META/REC_META below) — worth
  reconciling the other three tables to the same vocabulary when you wire
  this up for real.
-->

      </div>

        <div class="brand-name">Job Search Copilot</div>
      </div>

    var lastStep = steps[steps.length - 1];
    var trailing = (!TERMINAL_BAD[lastStep.status] && lastStep.status !== "OFFER")
      ? '<div class="timeline-connector connector-trailing"></div>' : "";
    return nodes + trailing;
  }
  function hasDescription(text) {
    return !!text && text.trim() !== "" && text.trim().toUpperCase() !== "N/A";
  }
  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }
  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) +
      ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }
  function hostnameOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return "—"; }
  }
  function initials(name) {
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function copySvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  }
  function copyText(btn, text) {
    try { navigator.clipboard.writeText(text).catch(function () {}); } catch (e) {}
    btn.classList.add("flash");
    setTimeout(function () { btn.classList.remove("flash"); }, 1100);
  }

  /* ---------------- render ---------------- */

  function renderVacancy(v) {
    // Topbar stays a static "Vacancy details" label — the H1 right below already carries the
    // vacancy title and company, so repeating them up here was just the same heading twice.

    document.getElementById("companyMark").textContent = initials(v.company);
    document.getElementById("companyName").textContent = v.company;
    document.getElementById("vacancyTitle").textContent = v.title;

    // ID, then score, then recommendation, in that order. Current status and "added" date are
    // already carried by the Status history timeline right below, so repeating a status tag / date
    // here was redundant.
    var meta = '<span class="detail-id-tag">#' + v.id + '</span>' +
      '<span class="pill ' + scoreClass(v.matchScore) + '">' + v.matchScore + '%</span>' +
      recTagHtml(v.recommendation, v.applyUrl);
    document.getElementById("vacancyMetaRow").innerHTML = meta;

    document.getElementById("statusTimeline").innerHTML = timelineHtml(v);

    var select = document.getElementById("statusSelect");
    select.innerHTML = Object.keys(STATUS_META).map(function (code) {
      return '<option value="' + code + '"' + (code === v.status ? " selected" : "") + '>' + STATUS_META[code][0] + '</option>';
    }).join("");
    select.onchange = function () {
      v.status = select.value;
      renderVacancy(v); // simplest correct re-render; swap for a targeted DOM update if this gets choppy
      // TODO: update_vacancy_status({ id: v.id, status: v.status }) — and log the change as a
      // STATUS_TRACKER/USER comment so it shows up in the history list below.
    };

    document.getElementById("openPostingBtn").href = v.applyUrl || "#";
    document.getElementById("copyIdBtn").onclick = function () { copyText(this, String(v.id)); };

    document.getElementById("backLabel").textContent = "Analyzed vacancies"; // set from wherever the visit came from

    /* description — clamped to a fixed height with a fade + "show more" toggle for long postings;
       short ones render in full with no toggle at all (checked after layout, below). */
    var descEl = document.getElementById("descriptionBody");
    if (hasDescription(v.fullText)) {
      descEl.innerHTML =
        '<div class="desc-wrap" id="descWrap">' +
          '<div class="desc-body" id="descBody">' + escapeHtml(v.fullText) + '</div>' +
          '<div class="desc-fade"></div>' +
        '</div>' +
        '<button type="button" class="desc-toggle" id="descToggle">' +
          '<span id="descToggleLabel">Show full description</span>' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
        '</button>';
      var descWrap = document.getElementById("descWrap");
      var descBody = document.getElementById("descBody");
      var descToggle = document.getElementById("descToggle");
      if (descBody.scrollHeight <= descBody.clientHeight + 2) {
        // Fits within the collapsed height already — nothing to expand, so drop the affordance.
        descToggle.style.display = "none";
        descWrap.querySelector(".desc-fade").style.display = "none";
      } else {
        descToggle.addEventListener("click", function () {
          var expanded = descWrap.classList.toggle("expanded");
          descToggle.classList.toggle("expanded", expanded);
          document.getElementById("descToggleLabel").textContent = expanded ? "Show less" : "Show full description";
        });
      }
    } else {
      descEl.innerHTML =
        '<div class="empty-block">' +
          '<div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5a1 1 0 0 0 1 1h5"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/></svg></div>' +
          '<p>Опис відсутній</p>' +
          '<span>Це джерело не надало повного тексту вакансії.</span>' +
        '</div>';
    }

    /* history */
    document.getElementById("historyCount").textContent = v.comments.length + (v.comments.length === 1 ? " entry" : " entries");
    var historyEl = document.getElementById("historyList");
    if (!v.comments.length) {
      historyEl.innerHTML = '<div class="empty-state">No comments yet</div>';
    } else {
      historyEl.innerHTML = v.comments.slice().sort(function (a, b) {
        return new Date(a.createdAt) - new Date(b.createdAt);
      }).map(function (c) {
        var src = historySourceMeta(c.source);
        return '<div class="history-item">' +
          '<div class="history-badge ' + src.cls + '">' + src.icon + '</div>' +
          '<div class="history-body">' +
            '<div class="history-head"><span class="history-source">' + escapeHtml(src.label) + '</span>' +
            '<span class="history-time mono">' + fmtDateTime(c.createdAt) + '</span></div>' +
            '<div class="history-text">' + escapeHtml(c.body) + '</div>' +
          '</div>' +
        '</div>';
      }).join("");
    }

    /* facts */
    var factRows = [
      ["Match score", '<span class="pill ' + scoreClass(v.matchScore) + '">' + v.matchScore + '%</span>'],
      ["Recommendation", recTagHtml(v.recommendation, v.applyUrl)],
      ["Salary in listing", v.salaryInListing ? escapeHtml(v.salaryInListing) : "not listed"],
      ["Tailored resume used", v.usedTailoredResume ? "Yes" : "No"],
      ["Source", escapeHtml(hostnameOf(v.applyUrl))],
      ["Status changed", fmtDateTime(v.statusChangedAt)],
      ["Last updated", fmtDateTime(v.updatedAt)],
      ["Vacancy ID", '<span class="mono">#' + v.id + '</span>']
    ];
    document.getElementById("factList").innerHTML = factRows.map(function (r) {
      return '<div class="fact-row"><span class="fact-label">' + r[0] + '</span><span class="fact-value">' + r[1] + '</span></div>';
    }).join("");

    /* other vacancies at this company */
    var siblings = fetchCompanyVacancies(v.company, v.id);
    document.getElementById("companyListTitle").textContent = "Other vacancies at " + v.company;
    document.getElementById("companyListCount").textContent = siblings.length + (siblings.length === 1 ? " vacancy" : " vacancies");
    var listEl = document.getElementById("companyListBody");
    if (!siblings.length) {
      listEl.innerHTML = '<div class="empty-state">Немає вакансій</div>';
    } else {
      listEl.innerHTML =
        '<div class="table-scroll"><table><thead><tr>' +
          '<th>Added</th><th>Vacancy</th><th>Score</th><th>Status</th>' +
        '</tr></thead><tbody>' +
        siblings.map(function (s) {
          var appliedNote = NOT_APPLIED_STATUSES[s.status] ? "" : ' <span class="detail-meta-sep">·</span> applied';
          return '<tr>' +
            '<td class="date-cell mono">' + fmtDate(s.createdAt) + '</td>' +
            '<td><div class="role-title-row">' +
                '<button type="button" class="role-title sibling-link" data-nav-id="' + s.id + '">' + escapeHtml(s.title) + '</button>' +
                '<a class="row-link-btn" href="' + escapeHtml(s.applyUrl) + '" target="_blank" rel="noopener" title="Open original posting">' + EXTERNAL_LINK_ICON + '</a>' +
              '</div>' +
              '<div class="role-meta">#' + s.id + appliedNote + '</div></td>' +
            '<td><span class="pill ' + scoreClass(s.matchScore) + '">' + s.matchScore + '%</span></td>' +
            '<td>' + statusTagHtml(s.status) + '</td>' +
          '</tr>';
        }).join("") +
        '</tbody></table></div>';
      // In the real app these are <Link>s to /vacancies/:id; here we just re-render this same
      // page with the sibling's data, so the whole flow is demonstrable in one file.
      listEl.querySelectorAll(".sibling-link").forEach(function (btn) {
        btn.addEventListener("click", function () { navigateTo(parseInt(btn.getAttribute("data-nav-id"), 10)); });
      });
    }
  }

  /* ---------------- sidebar / mobile shell (same mechanics as the main dashboard file) ---------------- */

  function isMobile() { return window.innerWidth <= 860; }
  function setSidebarCollapsed(collapsed) {
    var sidebar = document.getElementById("sidebar");
    var main = document.getElementById("mainArea");
    sidebar.classList.toggle("collapsed", collapsed);
    main.classList.toggle("rail", collapsed);
    document.getElementById("toggleLabel").textContent = collapsed ? "Expand" : "Collapse";
    document.getElementById("sidebarToggle").title = collapsed ? "Expand sidebar" : "Collapse sidebar";
  }
  function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("scrim").classList.add("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
  }
  document.getElementById("menuToggle").addEventListener("click", openSidebar);
  document.getElementById("scrim").addEventListener("click", closeSidebar);
  document.getElementById("sidebarToggle").addEventListener("click", function () {
    var collapsedNow = document.getElementById("sidebar").classList.contains("collapsed");
    setSidebarCollapsed(!collapsedNow);
  });
  // This page reads more like the dashboard (prose + one table) than the dense list views,
  // so the rail stays expanded by default — same RAIL_BY_DEFAULT convention as the main file.
  if (!isMobile()) setSidebarCollapsed(false);

  /* ---------------- theme toggle (identical to the main dashboard file) ---------------- */

  var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
  function getStoredTheme() { try { return localStorage.getItem("jsc-theme"); } catch (e) { return null; } }
  function setStoredTheme(value) { try { localStorage.setItem("jsc-theme", value); } catch (e) {} }
  function systemPrefersDark() { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") {
      document.documentElement.setAttribute("data-theme", theme);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    var isDark = theme === "dark" || (theme !== "light" && systemPrefersDark());
    var btn = document.getElementById("themeToggle");
    btn.innerHTML = isDark ? SUN_ICON : MOON_ICON;
    btn.title = isDark ? "Switch to light theme" : "Switch to dark theme";
  }
  document.getElementById("themeToggle").addEventListener("click", function () {
    var stored = getStoredTheme();
    var isDarkNow = stored === "dark" || (stored !== "light" && systemPrefersDark());
    var next = isDarkNow ? "light" : "dark";
    setStoredTheme(next);
    applyTheme(next);
  });

  /* ---------------- boot ---------------- */

  function start() {
    renderVacancy(fetchVacancy(initialVacancyId()));
    applyTheme(getStoredTheme());
  }

  if (window.claude && window.claude.hot && window.claude.hot.ready) {
    window.claude.hot.ready(start);
  } else {
    start();
  }
})();
</script>
