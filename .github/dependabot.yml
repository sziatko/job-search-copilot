# Version updates for what npm's security updates do not cover: the workflows' actions
# (pinned to commits — Dependabot moves the pin and its version comment) and the
# Dockerfiles' base images. npm itself gets security updates only (repo settings).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/api, /apps/mcp, /apps/web]
    schedule:
      interval: weekly
    # A Node major moves CI and local dev too (ci.yml's node-version), so it is a
    # planned change, not a bot PR.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      base-images:
        patterns: ['*']
