name: Images

# The production images (each Dockerfile's `production` stage). A pull request builds
# them only, so a Dockerfile regression fails there. A push to main or a phase-* branch
# also publishes them to GHCR: `sha-<commit>`, plus `latest` on main. phase-* too: a
# phase deploys before it merges. The packages are public — the server pulls with no
# login, so nothing secret goes into an image.
on:
  push:
    branches: [main, 'phase-*']
  pull_request:

# The docker/* actions are pinned to a commit: this job holds a token that can push
# packages, and a tag can be moved.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, mcp, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jsc-${{ matrix.app }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          # Links the package to this repo on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
