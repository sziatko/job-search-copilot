name: Images

# The production images (each Dockerfile's `production` stage). A pull request builds
# them only, so a Dockerfile regression fails there. A push to main or a phase-* branch
# also publishes them to GHCR: `sha-<commit>`, plus `latest` on main. phase-* too: a
# phase deploys before it merges. The packages are public — the server pulls with no
# login, so nothing secret goes into an image.
on:
  push:
    branches: [main, 'phase-*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, mcp, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jsc-${{ matrix.app }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          # Links the package to this repo on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
