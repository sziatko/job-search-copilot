name: CI

# Every pull request gets what its change needs (scripts/change-kind.mjs), and `gate` is the
# one required check. Jobs that skip, not workflow `paths`: a required workflow that a filter
# skips stays pending forever.
on:
  pull_request:

# Reads the repo, writes nothing to GitHub.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: kind
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Two lines: inside `echo "kind=$(…)"` a failed script would pass as an empty kind.
        run: |
          kind=$(node scripts/change-kind.mjs kind "$BASE_SHA" "$HEAD_SHA")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.kind != 'docs'
    uses: ./.github/workflows/verify.yml

  e2e:
    needs: changes
    if: needs.changes.outputs.kind != 'docs'
    uses: ./.github/workflows/e2e.yml

  # After `changes` only, so a docs PR gets its status too, and well before `gate` is green.
  review-status:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.changes.outputs.kind }}
          ACTOR: ${{ github.actor }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/review-status.mjs ci

  gate:
    if: always()
    needs: [changes, verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/change-kind.mjs gate
