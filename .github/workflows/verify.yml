name: Verify

# Lint, types, the tests over a real database, the build. A reusable workflow: its callers
# decide when it is needed.
on:
  workflow_call:

# Reads the repo, writes nothing to GitHub.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_search_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # vitest configs read process.env when no .env.test file is present (CI has none).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_search_copilot_test
      # Auth — fake values, as in .env.test.example.
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      LINKEDIN_CLIENT_ID: test-linkedin-client-id
      LINKEDIN_CLIENT_SECRET: test-linkedin-client-secret
      AUTH_ALLOWED_EMAILS: me@example.com
      PASSKEY_RP_ID: localhost
      MCP_PUBLIC_URL: http://localhost:3001/mcp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace=@job-search-copilot/core

      - name: Apply migrations to the test database
        working-directory: packages/core
        run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:scripts

      - run: npm run build
