# The app is a client-side router with real URLs — /applications, /vacancies, /inbox,
# /profile. nginx's default config answers a reload, a bookmark or a shared link
# on any of those with its own 404, so every unresolved path falls back to the
# shell and lets the router take over.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite emits content-hashed filenames, so a cached asset can never go stale.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
